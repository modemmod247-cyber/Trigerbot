name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Triggerbot_Mod
          path: build/libs/*.jar
          
